# scout configuration. Every key has a built-in default; this file is
# the auditable copy you can tune. Unknown keys fail the parse.

[auth]
# Path to a file containing a GitHub personal access token. Tilde
# expansion is honored. Unset means fall back to $GITHUB_TOKEN.
# token_path = "~/.config/scout/token"

[weights]
# Eight heuristics, weights in [0, 1]. Summed per issue, capped at 1.0
# for display. See the README for what each one measures.
root_cause         = 0.30
no_pr              = 0.20
recent             = 0.15
contributing_ok    = 0.15
reproducer         = 0.10
effort_ok          = 0.10
maintainer_touched = 0.05
active_repo        = 0.00

[filters]
# Issues older than this many days are dropped before scoring.
max_age_days   = 30
# Issues whose final score falls below this threshold are dropped.
min_score      = 0.50
# Issues taken via `scout took` within this many days are filtered
# out so the same issue is not re-picked during a contribution
# attempt. Set to 0 to disable.
cooldown_days  = 14
# Labels that disqualify an issue regardless of score.
exclude_labels = ["wontfix", "invalid", "duplicate"]
# Repos to skip before any fetch. Useful for venue-blocked repos
# (CLA-gated, no-AI policy, maintainer signal) that you want to
# leave in the watchlist as a record without paying HTTP for them.
# Each entry is `owner/repo` for an exact match or `owner/*` for
# the entire org.
#
# This template lists the bundled venue-block defaults that scout
# ships with. Setting the field replaces the list wholesale, so to
# add to it, copy the entries below and append your own. To opt
# out entirely, set `exclude_repos = []`.
exclude_repos = [
    # astral-sh/.github AI_POLICY.md: autonomous-agent contributions
    # are not accepted. Applies org-wide (uv, ruff, ty, ...).
    "astral-sh/*",
    # atuinsh/atuin: maintainer (ellie) closed two AI-source PRs on
    # 2026-05-05 citing GitHub load from AI-generated PR volume.
    "atuinsh/atuin",
    # clap-rs/clap: maintainer (epage) asked truffle-dev to stop
    # participating 2026-05-12; treat as org-wide opt-out.
    "clap-rs/*",
    # helix-editor/helix: MEMBER (the-mikedavis) signaling adoption
    # of a Ghostty-style no-LLM contribution policy across #15408
    # and #15605.
    "helix-editor/helix",
    # starship/starship: maintainer (davidkna) closed PR #7471 on
    # 2026-05-12 with "Not interested in contributions from bots."
    "starship/*",
    # stjude-rust-labs/sprocket CONTRIBUTING.md: no PRs including
    # AI-generated content from external contributors. Applies
    # across the wdl crates workspace.
    "stjude-rust-labs/*",
    # typst/typst CONTRIBUTING.md: "Do not vibecode the change!
    # Contributions implemented by an AI model will not be accepted."
    "typst/typst",
]
# Drop issues that already have an open cross-referenced pull
# request. Default true so candidates someone else is already
# PRing don't waste screening time. Set to false to keep them in
# the output (the `no_pr` score factor still penalizes them).
drop_if_open_pr = true
# Drop issues where a maintainer comment carries a "needs RFC /
# proposal / let's discuss this first" signal. Default true because
# PRs against issues with a pending design discussion typically
# draw a "should be an issue, not a PR" close.
drop_if_pending_discussion = true

[output]
# One of "auto", "always", "never". Validated at the CLI layer.
color = "auto"
# Maximum number of issues to print across all repos.
limit = 20
